<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <pattern id="checker" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#f3f4f6"></rect>
      <rect x="0" y="0" width="10" height="10" fill="#e5e7eb"></rect>
      <rect x="10" y="10" width="10" height="10" fill="#e5e7eb"></rect>
    </pattern>
  </defs>

  <rect width="200" height="200" fill="url(#checker)"></rect>
</svg>
